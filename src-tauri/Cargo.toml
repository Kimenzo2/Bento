[package]
name = "bento-desktop"
version = "0.1.0"
description = "Bento Desktop application"
authors = ["Lorenzo Otieno"]
edition = "2021"
default-run = "bento-desktop"

[lib]
name = "bento_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# ---------------------------------------------------------------------------
# Dependencies — ALL regular dependencies in a single contiguous block
# (target-specific deps use [target."..."] sections below)
# ---------------------------------------------------------------------------
[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "sqlite-unbundled",
  "migrate",
  "derive",
  "json",
] }
argon2 = { version = "0.5", features = ["std"] }
zeroize = { version = "1.8", features = ["derive"] }
secrecy = { version = "0.8", features = ["alloc"] }
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
aes-gcm-siv = "0.11"
tauri = { version = "2", features = ["tray-icon", "custom-protocol"], optional = true }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-notification = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-oauth = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
url = "2"
uuid = { version = "1", features = ["v4"] }
keyring = "3"
zip = "2"
roxmltree = "0.21"
lopdf = "0.38"
printpdf = "0.7"
mobi = "0.8"
cpal = "0.15"
hound = "3.5"
rodio = "0.19"
sysinfo = "0.33"
libloading = "0.8"
regex = "1"
image = "0.25"
neo_frizbee = "0.10"

# ---------------------------------------------------------------------------
# Target-specific dependencies
# ---------------------------------------------------------------------------
[target."cfg(not(target_os = \"macos\"))".dependencies.libsqlite3-sys]
version = "0.30"
features = ["sqlcipher", "unlock_notify"]

[target."cfg(target_os = \"macos\")".dependencies.libsqlite3-sys]
version = "0.30"
features = ["bundled-sqlcipher", "unlock_notify"]

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }

[target."cfg(any(target_os = \"macos\", target_os = \"linux\", windows))".dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# ---------------------------------------------------------------------------
# Features
# ---------------------------------------------------------------------------
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# ---------------------------------------------------------------------------
# Profiles
# ---------------------------------------------------------------------------
[profile.release]
codegen-units = 1
opt-level = "z"
debug = false
incremental = false
panic = "abort"
strip = true
lto = true

[profile.dev]
codegen-units = 256
opt-level = 0
debug = 1
incremental = true
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1

[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.dev.package.ring]
opt-level = 3

[profile.ci]
inherits = "dev"
debug = 0
incremental = false
codegen-units = 64
