    /* iOS Safe Area Insets */
    :root {
      --safe-area-inset-top: env(safe-area-inset-top, 0px);
      --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
      --safe-area-inset-left: env(safe-area-inset-left, 0px);
      --safe-area-inset-right: env(safe-area-inset-right, 0px);
    }

    body {
      background-color: #FFF8E7;
      color: #5A5A5A;
      font-family: 'Manrope', sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      /* iOS smooth scrolling */
      -webkit-overflow-scrolling: touch;
      /* Only prevent horizontal overscroll — vertical must remain free */
      overscroll-behavior-x: none;
      overscroll-behavior-y: auto;
    }

    /* Apply safe area padding to app container */
    #root {
      padding-top: var(--safe-area-inset-top);
      padding-bottom: var(--safe-area-inset-bottom);
      padding-left: var(--safe-area-inset-left);
      padding-right: var(--safe-area-inset-right);
      min-height: 100vh;
      min-height: 100dvh; /* Dynamic viewport height for iOS */
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }

    /* Mobile touch improvements */
    @media (max-width: 768px) {
      /* Prevent horizontal scrolling on mobile — but NEVER restrict vertical */
      html, body {
        overflow-x: hidden;
        overflow-y: auto !important;
        max-width: 100vw;
        overscroll-behavior-x: none;
        overscroll-behavior-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      /* Better touch targets */
      button, a, [role="button"] {
        min-height: 44px; /* iOS minimum touch target */
        -webkit-tap-highlight-color: transparent;
      }

      /* Prevent text selection on interactive elements */
      button, [role="button"] {
        -webkit-user-select: none;
        user-select: none;
      }

      /* Prevent pull-to-refresh on main content */
      .no-pull-refresh {
        overscroll-behavior-y: contain;
      }
    }

    /* iOS specific fixes */
    @supports (-webkit-touch-callout: none) {
      /* Fix for iOS momentum scrolling */
      .scroll-container {
        -webkit-overflow-scrolling: touch;
      }

      /* Fix for iOS input zoom */
      input, select, textarea {
        font-size: 16px !important;
      }

      /* Fix for iOS 100vh issue */
      .h-screen-ios {
        height: 100vh;
        height: 100dvh;
      }
    }

    /* Tablet optimizations */
    @media (min-width: 768px) and (max-width: 1024px) {
      /* iPad portrait and landscape adjustments */
      .tablet-container {
        padding: 1rem;
      }
    }

    /* Horizontal scrollable tabs - hide scrollbar */
    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #FFF8E7;
    }

    ::-webkit-scrollbar-thumb {
      background: #FFE4CC;
      border-radius: 5px;
      border: 2px solid #FFF8E7;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #FFD93D;
    }

    /* Mobile bottom navigation safe area */
    .mobile-bottom-nav {
      padding-bottom: calc(0.5rem + var(--safe-area-inset-bottom));
    }

    /* Collaborative mode mobile tab bar */
    .collab-mobile-tabs {
      position: fixed;
      bottom: calc(4.5rem + var(--safe-area-inset-bottom));
      left: 0.5rem;
      right: 0.5rem;
      z-index: 40;
      display: flex;
      justify-content: center;
      gap: 0.25rem;

      border-radius: 1rem;
      padding: 0.5rem;

    /* Prevent content from being hidden behind mobile navs */
    .mobile-content-padding {

    }
    
    /* ── Genesis App Skeleton — shown before React mounts ──
       All colours come from CSS vars set by the theme-detection script below.
       Defaults match the Genesis Classic light theme.
    */
    :root {
      --sk-bg:      #FFF8E7;
      --sk-surface: #FFFFFF;
      --sk-border:  #FFE4CC;
      --sk-shimmer: rgba(255,255,255,0.55);
      --sk-hero:    linear-gradient(135deg,#FFFFFF 0%,#FFF8E7 100%);
    }
    @keyframes gs-shimmer {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .gs-bone {
      position: relative;
      overflow: hidden;
      background: var(--sk-border);
      border-radius: 8px;
      flex-shrink: 0;
    }
    .gs-bone::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 0%, var(--sk-shimmer) 50%, transparent 100%);
      animation: gs-shimmer 1.6s ease-in-out infinite;
    }
    #gs-skeleton {
      display: flex;
      flex-direction: column;
      position: fixed;
      inset: 0;
      background: var(--sk-bg);
      font-family: system-ui, sans-serif;
      overflow-y: auto;
    }
    #gs-skeleton .gs-nav {
      position: fixed; top:0; left:0; right:0; height:64px;
      background:var(--sk-surface); border-bottom:1px solid var(--sk-border);
      display:flex; align-items:center; padding:0 24px; gap:12px; z-index:100; box-sizing:border-box;

    #gs-skeleton .gs-body {

      display:flex; flex-direction:column; gap:20px; box-sizing:border-box; width:100%;

      padding:28px 32px; display:flex; gap:24px; align-items:center; justify-content:space-between;

    #gs-skeleton .gs-main { display:flex; gap:20px; align-items:flex-start; }

    #gs-skeleton .gs-card {

</head>

    var dark=localStorage.getItem('genesis_dark_mode')==='true';

    r.style.setProperty('--color-surface',c[1]);
    r.style.setProperty('--color-border',c[2]);
    if(dark){r.classList.add('dark');r.style.setProperty('color-scheme','dark');}
  })();

  <script>
    // Hide the static skeleton once React mounts into #root
    (function(){
      var sk = document.getElementById('gs-skeleton');
      if (!sk) return;
      var mo = new MutationObserver(function(){
        var root = document.getElementById('root');
        if (root && root.childElementCount > 0) {
          sk.style.display = 'none';
          mo.disconnect();
        }
      });
      mo.observe(document.body, { childList:true, subtree:true });
    })();
  </script>
