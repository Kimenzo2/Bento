name: Rust Realtime Tests

on:
  push:
    branches:
      - main
      - develop
      - "release/**"
      - "Gemini-api-connections"
    paths:
      - "apps/genesis-desktop/src-tauri/**"
      - ".github/workflows/rust-realtime-tests.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "apps/genesis-desktop/src-tauri/**"
  workflow_dispatch:

concurrency:
  group: rust-realtime-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: apps/genesis-desktop

jobs:
  realtime-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}/src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Sccache cache
        uses: mozilla-actions/sccache-action@054db53350805f83040bf3e6e9b8cf5a139aa7c9 # v0.0.7

      - name: Install Tauri system dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libgbm-dev \
            libsqlcipher-dev \
            pkg-config

      - name: Install Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install stable --component rustfmt
          rustup default stable

      - name: Cache Cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles(format('{0}/src-tauri/Cargo.lock', env.APP_DIR)) }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Platform sidecar stubs (Linux runner)
        # tauri.conf.json declares externalBin for chatgpt-proxy + bento-spectrum,
        # but only Windows .exe binaries are committed. tauri-build needs a file
        # matching the runner's target-triple name to exist; the realtime_hub lib
        # test never executes the sidecars, so minimal placeholder binaries with a
        # correct ELF header are sufficient to satisfy the build.
        shell: bash
        run: |
          for name in chatgpt-proxy bento-spectrum; do
            f="binaries/${name}-x86_64-unknown-linux-gnu"
            printf '\x7fELF' > "$f"   # 4-byte ELF magic
            head -c 64 /dev/zero >> "$f"
          done
          ls -la binaries/

      - name: Run realtime_hub integration tests
        env:
          RUSTC_WRAPPER: sccache
        run: cargo test --test realtime_hub -- --nocapture