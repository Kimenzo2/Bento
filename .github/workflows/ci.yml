name: CI

on:
  push:
    branches: [main, develop, 'release/**', 'Gemini-api-connections']
  pull_request:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: apps/genesis-desktop

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Oxc Check
        run: bun run check
      - name: Lint
        run: bun run lint
      - name: Type Check
        continue-on-error: true
        run: bun run type-check:fast
      - name: Unit Tests
        run: bun run test
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}/src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Sccache cache
        uses: mozilla-actions/sccache-action@v0.0.7
      - name: Install Tauri deps
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev
      - name: Install Rust
        run: |
          rustup set profile minimal
          rustup toolchain install stable --component clippy
          rustup default stable
      - name: cargo check
        run: cargo check --profile ci --workspace --bins --tests
      - name: cargo clippy
        continue-on-error: true
        run: cargo clippy --workspace -- -D warnings
      - name: cargo build
        run: cargo build --profile ci --workspace --bins
      - name: cargo test
        run: cargo test --profile ci --workspace --no-fail-fast
