name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.2.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: apps/genesis-desktop
  VCPKG_COMMIT: e1dfb369fc1c6e58d5850cf67c224caa955309e5
  VCPKG_TRIPLET: x64-windows-static-md

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      tag_name: ${{ steps.get-version.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get version
        id: get-version
        run: |
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          VERSION=${TAG_NAME#v}
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get-version.outputs.tag_name }}
          name: Bento v${{ steps.get-version.outputs.version }}
          draft: true
          generate_release_notes: true
  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            arch: arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            arch: x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            arch: amd64
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Sccache
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Cache vcpkg binaries
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\vcpkg-bincache
          key: windows-vcpkg-sqlcipher-${{ env.VCPKG_COMMIT }}-${{ env.VCPKG_TRIPLET }}

      - name: Install SQLCipher with vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP 'vcpkg'
          $vcpkgCache = Join-Path $env:RUNNER_TEMP 'vcpkg-bincache'
          New-Item -ItemType Directory -Force -Path $vcpkgCache | Out-Null

          if (-not (Test-Path $vcpkgRoot)) {
            git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          }
          git -C $vcpkgRoot checkout $env:VCPKG_COMMIT
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          & "$vcpkgRoot\vcpkg.exe" install "sqlcipher[fts5,json1]:$env:VCPKG_TRIPLET" --binarysource="clear;files,$vcpkgCache,readwrite"

          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_TRIPLET=$env:VCPKG_TRIPLET" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_TARGET_TRIPLET=$env:VCPKG_TRIPLET" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKGRS_TRIPLET=$env:VCPKG_TRIPLET" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_BINARY_SOURCES=clear;files,$vcpkgCache,readwrite" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKGRS_DYNAMIC=0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SQLCIPHER_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SQLCIPHER_INCLUDE_DIR=$($vcpkgRoot)\installed\$env:VCPKG_TRIPLET\include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SQLCIPHER_LIB_DIR=$($vcpkgRoot)\installed\$env:VCPKG_TRIPLET\lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $libclang = Get-ChildItem -Path 'C:\Program Files\LLVM\bin', 'C:\Program Files (x86)\LLVM\bin' -Filter libclang.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $libclang) {
            throw 'libclang.dll was not found. SQLx sqlite-unbundled requires bindgen/libclang on Windows.'
          }
          "LIBCLANG_PATH=$($libclang.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          & "$vcpkgRoot\vcpkg.exe" list
      - name: Install Rust
        run: |
          rustup set profile minimal
          rustup toolchain install stable --component rustfmt
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: Linux deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -q \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            libsqlcipher-dev
      - name: macOS deps
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install sqlcipher
      - name: Build MCP sidecar
        shell: bash
        run: |
          cargo build --profile ci --target ${{ matrix.target }} --manifest-path src-tauri/Cargo.toml --bin bento-mcp
          mkdir -p src-tauri/binaries
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "src-tauri/target/${{ matrix.target }}/ci/bento-mcp.exe" "src-tauri/binaries/bento-mcp-${{ matrix.target }}.exe"
          else
            cp "src-tauri/target/${{ matrix.target }}/ci/bento-mcp" "src-tauri/binaries/bento-mcp-${{ matrix.target }}"
          fi
      - name: Install dependencies
        run: bun install
      - name: Build Tauri app
        id: build-tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: ${{ env.APP_DIR }}
          tauriScript: bun run tauri
          tagName: ${{ needs.prepare.outputs.tag_name }}
          releaseName: Bento v${{ needs.prepare.outputs.version }}
          releaseDraft: true
          releaseId: ''
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          name: Bento v${{ needs.prepare.outputs.version }}
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
