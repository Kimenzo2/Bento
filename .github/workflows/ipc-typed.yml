# ⚠️ ABSOLUTE GIT SAFETY LAW ⚠️ — THE AGENT MUST NEVER RUN git reset, git stash, git checkout --, git clean -f, git restore, git revert, git rebase, git cherry-pick, git commit --amend, git push --force, OR ANY OTHER DESTRUCTIVE GIT OPERATION WITHOUT EXPLICIT CONSENT FROM THE OWNER. WORKING TREE CHANGES ARE PRECIOUS AND IRREPLACEABLE. THEY MUST NEVER BE STASHED, DISCARDED, REVERTED, RESET, OR OVERWRITTEN. ALWAYS ASK THE OWNER FIRST. NO EXCEPTIONS, EVER.

name: Typed IPC

on:
  push:
    branches: [main, develop, "release/**", "Gemini-api-connections"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: apps/genesis-desktop

jobs:
  rust-bindings:
    name: Rust typed bindings (regenerate + drift check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}/src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Sccache cache
        uses: mozilla-actions/sccache-action@054db53350805f83040bf3e6e9b8cf5a139aa7c9 # v0.0.7
        with:
          cache-key: ${{ runner.os }}-cargo-${{ hashFiles(format('{0}/src-tauri/Cargo.lock', env.APP_DIR)) }}
      - name: Install Tauri system dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libgbm-dev \
            libsqlcipher-dev \
            pkg-config
      - name: Install Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install stable --component rustfmt --component clippy
          rustup default stable
      - name: Cache Cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles(format('{0}/src-tauri/Cargo.lock', env.APP_DIR)) }}
          restore-keys: ${{ runner.os }}-cargo-registry-
      - name: Platform sidecar stubs (Linux runner)
        # tauri.conf.json declares externalBin for chatgpt-proxy + bento-spectrum,
        # but only Windows .exe binaries are committed. tauri-build needs a file
        # matching the runner's target-triple name to exist; the typed-bindings
        # lib test never executes the sidecars, so minimal placeholder binaries
        # with a correct ELF header are sufficient to satisfy the build.
        shell: bash
        run: |
          for name in chatgpt-proxy bento-spectrum; do
            f="binaries/${name}-x86_64-unknown-linux-gnu"
            printf '\x7fELF' > "$f"   # 4-byte ELF magic
            head -c 64 /dev/zero >> "$f"
          done
          ls -la binaries/
      - name: cargo check (annotations compile)
        env:
          RUSTC_WRAPPER: sccache
        run: cargo check --profile ci --workspace --bins --tests
      - name: Regenerate TypeScript bindings
        env:
          RUSTC_WRAPPER: sccache
        run: timeout 300 cargo test --profile ci --lib regenerate_typescript_bindings
      - name: Fail if bindings drifted from the annotated source
        working-directory: .
        run: git diff --exit-code -- ${{ env.APP_DIR }}/src/lib/bindings.ts
      - name: Upload generated bindings (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: bento-typed-bindings
          path: ${{ env.APP_DIR }}/src/lib/bindings.ts
          if-no-files-found: error

  frontend-typed:
    name: Frontend against generated bindings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: rust-bindings
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Download generated bindings
        uses: actions/download-artifact@v4
        with:
          name: bento-typed-bindings
          path: ${{ env.APP_DIR }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Svelte Check (typed invoke/event usage)
        run: bun run check | grep -v "^Warn:"
      - name: Lint
        continue-on-error: true
        run: bun run lint
      - name: Unit Tests
        run: bun run test