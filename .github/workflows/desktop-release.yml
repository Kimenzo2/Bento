name: Publish Bento Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'genesis-desktop-v*'

permissions:
  contents: write

jobs:
  publish-windows:
    name: Publish Windows Installer
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: ./apps/genesis-desktop
    env:
      CI: true
      CARGO_BUILD_JOBS: 2

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Sccache
        uses: mozilla-actions/sccache-action@054db53350805f83040bf3e6e9b8cf5a139aa7c9 # v0.0.7

      - name: Cache vcpkg binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/AppData/Local/Genesis/vcpkg
            ~/AppData/Local/Genesis/vcpkg-bincache
          key: windows-vcpkg-${{ hashFiles('apps/genesis-desktop/scripts/setup-vcpkg.ps1') }}

      - name: Install vcpkg + SQLCipher
        shell: pwsh
        run: |
          & "${{ github.workspace }}\apps\genesis-desktop\scripts\setup-vcpkg.ps1"
          @('VCPKG_ROOT','VCPKG_DEFAULT_TRIPLET','VCPKG_TARGET_TRIPLET','VCPKGRS_TRIPLET','VCPKG_BINARY_SOURCES','VCPKGRS_DYNAMIC','SQLCIPHER_STATIC','SQLCIPHER_INCLUDE_DIR','SQLCIPHER_LIB_DIR') | ForEach-Object {
            "$_=$([System.Environment]::GetEnvironmentVariable($_))" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          $llp = [System.Environment]::GetEnvironmentVariable('LIBCLANG_PATH')
          if ($llp) { "LIBCLANG_PATH=$llp" | Out-File -FilePath $env:GITHUB_ENV -Append }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          target: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ./apps/genesis-desktop/src-tauri -> target

      - name: Install dependencies
        run: bun install

      - name: Build Windows installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: bun run release:windows

      - name: Normalize release asset names
        run: |
          $bundleRoot = Join-Path $PWD 'src-tauri\target\release\bundle\nsis'
          $installer = Get-ChildItem -Path $bundleRoot -Filter '*-setup.exe' |
            Select-Object -First 1

          if (-not $installer) {
            throw 'Windows installer not found.'
          }

          $stableInstaller = Join-Path $bundleRoot 'Bento_Windows_x64-setup.exe'
          Copy-Item -LiteralPath $installer.FullName -Destination $stableInstaller -Force

      - name: Verify updater artifacts
        shell: pwsh
        run: |
          $sigFiles = Get-ChildItem -Path "src-tauri/target/release" -Recurse -Filter "*.sig"
          $zipFiles = Get-ChildItem -Path "src-tauri/target/release" -Recurse -Filter "*.nsis.zip"
          if ($sigFiles.Count -eq 0) {
            Write-Warning "No .sig files found — this release will NOT support self-updates."
          } else {
            Write-Host "Found $($sigFiles.Count) signature(s) and $($zipFiles.Count) archive(s)"
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Bento Desktop ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            apps/genesis-desktop/src-tauri/target/release/bundle/nsis/Bento_Windows_x64-setup.exe
            apps/genesis-desktop/src-tauri/target/release/bundle/nsis/*.nsis.zip
            apps/genesis-desktop/src-tauri/target/release/bundle/nsis/*.sig
