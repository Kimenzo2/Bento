name: Publish Genesis Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'genesis-desktop-v*'

permissions:
  contents: write

jobs:
  publish-windows:
    name: Publish Windows Installer
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: ./apps/genesis-desktop
    env:
      CI: true
      CARGO_BUILD_JOBS: 2
      VCPKG_COMMIT: e1dfb369fc1c6e58d5850cf67c224caa955309e5
      VCPKG_TRIPLET: x64-windows-static-md
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      GENESIS_DESKTOP_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.GENESIS_DESKTOP_WINDOWS_CERTIFICATE_THUMBPRINT }}
      GENESIS_DESKTOP_WINDOWS_SIGN_COMMAND: ${{ secrets.GENESIS_DESKTOP_WINDOWS_SIGN_COMMAND }}
      GENESIS_DESKTOP_WINDOWS_TIMESTAMP_URL: ${{ secrets.GENESIS_DESKTOP_WINDOWS_TIMESTAMP_URL }}
      TAURI_WINDOWS_SIGNTOOL_PATH: ${{ secrets.TAURI_WINDOWS_SIGNTOOL_PATH }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\vcpkg-bincache
          key: windows-vcpkg-sqlcipher-${{ env.VCPKG_COMMIT }}-${{ env.VCPKG_TRIPLET }}

      - name: Install SQLCipher with vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP 'vcpkg'
          $vcpkgCache = Join-Path $env:RUNNER_TEMP 'vcpkg-bincache'
          New-Item -ItemType Directory -Force -Path $vcpkgCache | Out-Null

          if (-not (Test-Path $vcpkgRoot)) {
            git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          }
          git -C $vcpkgRoot checkout $env:VCPKG_COMMIT
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          & "$vcpkgRoot\vcpkg.exe" install "sqlcipher[fts5,json1]:$env:VCPKG_TRIPLET" --binarysource="clear;files,$vcpkgCache,readwrite"

          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_TRIPLET=$env:VCPKG_TRIPLET" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_TARGET_TRIPLET=$env:VCPKG_TRIPLET" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_BINARY_SOURCES=clear;files,$vcpkgCache,readwrite" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKGRS_DYNAMIC=0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SQLCIPHER_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $libclang = Get-ChildItem -Path 'C:\Program Files\LLVM\bin', 'C:\Program Files (x86)\LLVM\bin' -Filter libclang.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $libclang) {
            throw 'libclang.dll was not found. SQLx sqlite-unbundled requires bindgen/libclang on Windows.'
          }
          "LIBCLANG_PATH=$($libclang.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          & "$vcpkgRoot\vcpkg.exe" list

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./apps/genesis-desktop/src-tauri -> target

      - name: Install dependencies
        run: bun install

      - name: Build Windows installer
        run: bun run release:windows

      - name: Normalize release asset names
        run: |
          $bundleRoot = Join-Path $PWD 'src-tauri\target\release\bundle\nsis'
          $installer = Get-ChildItem -Path $bundleRoot -Filter '*-setup.exe' |
            Where-Object { $_.Name -notlike '*.sig' } |
            Select-Object -First 1

          if (-not $installer) {
            throw 'Windows installer not found.'
          }

          $stableInstaller = Join-Path $bundleRoot 'Genesis_Windows_x64-setup.exe'
          Copy-Item -LiteralPath $installer.FullName -Destination $stableInstaller -Force

          $sourceSig = "$($installer.FullName).sig"
          if (-not (Test-Path $sourceSig)) {
            throw "Updater signature not found: $sourceSig"
          }

          Copy-Item -LiteralPath $sourceSig -Destination "$stableInstaller.sig" -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Genesis Desktop ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            apps/genesis-desktop/src-tauri/target/release/bundle/nsis/Genesis_Windows_x64-setup.exe
            apps/genesis-desktop/src-tauri/target/release/bundle/nsis/Genesis_Windows_x64-setup.exe.sig
