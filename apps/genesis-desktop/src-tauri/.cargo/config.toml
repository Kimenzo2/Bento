[build]
rustc-wrapper = "sccache"

[env]
RUST_MIN_STACK = "33554432"
LIBSQLITE3_SYS_USE_PKG_CONFIG = "0"

[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
rustflags = [
  "-C",
  "linker=rust-lld",
  "-C",
  "codegen-units=256",
  "-C",
  "debuginfo=line-tables-only",
  "-C",
  "split-debuginfo=packed",
  # Strip CI builder paths from release binaries — prevents user-path leakage
  # This remaps C:\Users\runneradmin\ (GitHub Actions CI runner) to /ci/
  # so reverse-engineered binaries show /ci/.cargo/... instead of the real path.
  # Safe because file!() paths are only used in panic messages/debug info,
  # never for actual filesystem access at runtime.
  "--remap-path-prefix=C:\\Users\\runneradmin\\=/ci/",
]

[target.x86_64-unknown-linux-gnu]
linker = "clang"

[target.aarch64-apple-darwin]
# Use the system Apple ld64 linker. The macOS runner does not ship lld.

[target.x86_64-apple-darwin]
# Use the system Apple ld64 linker. The macOS runner does not ship lld.
