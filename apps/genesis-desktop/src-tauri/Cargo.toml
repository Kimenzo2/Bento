[package]
name = "genesis-desktop"
version = "0.1.0"
description = "Genesis Desktop application"
authors = ["Lorenzo Otieno"]
edition = "2021"
default-run = "genesis-desktop"

[lib]
name = "genesis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossbeam-channel = "0.5"
rmcp = { version = "1.6.0", features = ["transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros"] }
sysinfo = "0.37"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-notification = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["full"] }

[target."cfg(any(target_os = \"macos\", target_os = \"linux\", windows))".dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# Release profile optimized for production binaries
[profile.release]
codegen-units = 1
opt-level = "z"
debug = false
incremental = false
panic = "abort"
strip = true
lto = true

# Fast dev builds with full debug info and incremental compilation
[profile.dev]
codegen-units = 256
opt-level = 0
debug = true
incremental = true
