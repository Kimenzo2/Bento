[package]
name = "genesis-desktop"
version = "0.1.0"
description = "Genesis Desktop application"
authors = ["Lorenzo Otieno"]
edition = "2021"
default-run = "genesis-desktop"

[lib]
name = "genesis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["sync", "time"] }
rmcp = { version = "1.5.0", features = ["server"] }

[target."cfg(any(target_os = \"macos\", target_os = \"linux\", windows))".dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# Release profile optimized for production binaries
[profile.release]
codegen-units = 1
opt-level = 3
debug = false
incremental = false
lto = "thin"

# Dev builds tuned to stay within the available Windows memory budget
[profile.dev]
codegen-units = 1
opt-level = 0
debug = 1
incremental = true
