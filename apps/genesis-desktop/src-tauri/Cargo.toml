[package]
name = "bento-desktop"
version = "0.2.16"
description = "Bento Desktop application"
authors = ["Lorenzo Otieno"]
edition = "2021"
default-run = "bento-desktop"

[lib]
name = "bento_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "migrate",
  "derive",
  "json",
] }

# Cryptography
argon2 = { version = "0.5", features = ["std"] }
zeroize = { version = "1.8", features = ["derive"] }
secrecy = { version = "0.8", features = ["alloc"] }
rand = "0.8"
hex = "0.4"

tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-liquid-glass = "0.1"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-notification = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = [
  "sync",
  "time",
  "net",
  "rt-multi-thread",
  "macros",
  "io-util",
] }
base64 = "0.22"
keyring = "3"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "stream",
] }
futures = "0.3"
tracing = "0.1"
bytes = "1"
sha2 = "0.10"
aes-gcm-siv = "0.11"
tauri-plugin-oauth = "2"
tauri-plugin-opener = "2"
url = "2"
zip = "2"
roxmltree = "0.21"
lopdf = "0.38"
printpdf = "0.7"
mobi = "0.8"
cpal = "0.15"
hound = "3.5"
rodio = "0.19"
sysinfo = "0.33"
libloading = "0.8"
raw-window-handle = "0.6"
uuid = { version = "1", features = ["v4"] }
regex = "1"
once_cell = "1"
image = "0.25"
neo_frizbee = "0.10"
rmcp = { version = "1.7", features = [
  "server",
  "macros",
  "schemars",
  "transport-streamable-http-server",
  "transport-streamable-http-server-session",
] }
tower = { version = "0.5", features = ["util"] }
xcap = "0.9.6"
axum = { version = "0.7", default-features = false, features = ["json", "tokio", "http1"] }
schemars = "0.8"

# Windows/Linux: system-linked SQLCipher via vcpkg/pkg-config
# macOS: bundled-sqlcipher required for universal-apple-darwin (cross-arch
# compilation; system brew sqlcipher is single-arch only)
[target."cfg(not(target_os = \"macos\"))".dependencies.libsqlite3-sys]
version = "0.30"
features = ["sqlcipher", "unlock_notify"]

[target."cfg(target_os = \"macos\")".dependencies.libsqlite3-sys]
version = "0.30"
features = ["bundled-sqlcipher", "unlock_notify"]

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }

[target."cfg(any(target_os = \"macos\", target_os = \"linux\", windows))".dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target."cfg(windows)".dependencies.windows-sys]
version = "0.52"
features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"]

[dev-dependencies]
tempfile = "3"

# ---------------------------------------------------------------------------
# Profiles
# ---------------------------------------------------------------------------

[profile.release]
codegen-units = 1
opt-level = "z"
debug = false
incremental = false
panic = "abort"
strip = true
lto = true

[profile.dev]
codegen-units = 256
opt-level = 0
debug = 1
incremental = true
split-debuginfo = "unpacked"

# All C/C++ dependency crates: compile at opt-level 1 even in dev.
# C code is slower at -O0 (no builtin inlining). This only affects
# first compile, not incremental Rust rebuilds.
[profile.dev.package."*"]
opt-level = 1

# Biggest compile bottlenecks -- pure C/C++, always opt-level 3
[profile.dev.package.libsqlite3-sys]
opt-level = 3
[profile.dev.package.ring]
opt-level = 3

# CI profile: no debug info, no incremental (cold CI starts)
[profile.ci]
inherits = "dev"
debug = 0
incremental = false
codegen-units = 64
