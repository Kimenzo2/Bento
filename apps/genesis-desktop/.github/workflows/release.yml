# Bento Desktop — CrabNebula Cloud Release Pipeline
#
# Triggered by:
#   - Pushing a tag matching v* (e.g., v0.2.0)
#   - Manual workflow_dispatch with a tag input (for re-runs)
#
# Pipeline:
#   1. prepare   — Extracts version from tag
#   2. draft     — Creates a release draft on CrabNebula Cloud
#   3. build     — Matrix build across macOS (aarch64 + x86_64), Windows (x64), Linux (x64)
#   4. publish   — Publishes the release on CrabNebula Cloud
#   5. deploy-landing — Downloads assets from CrabNebula CDN → copies to landing page → deploys Vercel

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.2.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: apps/genesis-desktop
  CN_APPLICATION: bento-industries/bento

jobs:
  # ─────────────────────────────────────────────────────────
  # 1. PREPARE — Extract version info
  # ─────────────────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      tag_name: ${{ steps.get-version.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get-version
        shell: bash
        run: |
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────
  # 2. DRAFT — Create a release draft on CrabNebula Cloud
  # ─────────────────────────────────────────────────────────
  draft:
    needs: prepare
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release on CrabNebula Cloud
        uses: crabnebula-dev/cloud-release@v0
        with:
          command: release draft ${{ env.CN_APPLICATION }} --framework tauri
          api-key: ${{ secrets.CN_API_KEY }}

  # ─────────────────────────────────────────────────────────
  # 3. BUILD — Matrix build across platforms
  # ─────────────────────────────────────────────────────────
  build:
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            arch: arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            arch: x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            arch: amd64

    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Sccache (distributed compilation cache) ──
      - name: Sccache cache
        uses: mozilla-actions/sccache-action@v0.0.7
        with:
          cache-key: ${{ runner.os }}-release-${{ hashFiles(format('{0}/src-tauri/Cargo.lock', env.APP_DIR)) }}

      # ── Rust toolchain ──
      - name: Install Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install stable --component rustfmt
          rustup default stable
          rustup target add ${{ matrix.target }}

      # ── Bun + Node.js ──
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      # ── Linux system deps (Tauri v2) ──
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev

      # ── Cargo registry cache ──
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-release-${{ hashFiles(format('{0}/src-tauri/Cargo.lock', env.APP_DIR)) }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-release-

      # ── Pre-build MCP sidecar ──
      - name: Build MCP sidecar
        shell: bash
        env:
          RUSTC_WRAPPER: sccache
        run: |
          cargo build --profile ci \
            --target ${{ matrix.target }} \
            --manifest-path src-tauri/Cargo.toml \
            --bin bento-mcp
          mkdir -p src-tauri/binaries
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "src-tauri/target/${{ matrix.target }}/ci/bento-mcp.exe" \
               "src-tauri/binaries/bento-mcp-${{ matrix.target }}.exe"
          else
            cp "src-tauri/target/${{ matrix.target }}/ci/bento-mcp" \
               "src-tauri/binaries/bento-mcp-${{ matrix.target }}"
          fi

      # ── Build the Tauri app ──
      - name: Build Tauri app
        shell: bash
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          bun install
          bun run tauri build \
            --bundles ${{ matrix.bundles }} \
            --target ${{ matrix.target }}

      # ── macOS: Also build for x86_64 (Intel) ──
      - name: Build Tauri app (macOS x86_64)
        if: runner.os == 'macOS'
        shell: bash
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          rustup target add x86_64-apple-darwin
          bun run tauri build \
            --bundles dmg \
            --target x86_64-apple-darwin

      # ── Upload assets to CrabNebula Cloud ──
      - name: Upload assets to CrabNebula Cloud
        uses: crabnebula-dev/cloud-release@v0
        with:
          command: release upload ${{ env.CN_APPLICATION }} --framework tauri
          api-key: ${{ secrets.CN_API_KEY }}
          working-directory: ${{ env.APP_DIR }}

  # ─────────────────────────────────────────────────────────
  # 4. PUBLISH — Publish the release on CrabNebula Cloud
  # ─────────────────────────────────────────────────────────
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Publish release on CrabNebula Cloud
        uses: crabnebula-dev/cloud-release@v0
        with:
          command: release publish ${{ env.CN_APPLICATION }} --framework tauri
          api-key: ${{ secrets.CN_API_KEY }}

  # ─────────────────────────────────────────────────────────
  # 5. DEPLOY LANDING — Download assets from CrabNebula CDN,
  #    sync to landing page public/downloads/, deploy Vercel
  # ─────────────────────────────────────────────────────────
  deploy-landing:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download release assets from CrabNebula CDN
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p apps/landing/public/downloads

          CDN_BASE="https://cdn.crabnebula.app/download/bento-industries/bento/latest/platform"

          # Windows (NSIS x86_64)
          curl -fSL -o "apps/landing/public/downloads/Bento_${VERSION}_x64-setup.exe" \
            "$CDN_BASE/nsis-x86_64" || echo "WARN: nsis-x86_64 not found"

          # macOS (DMG aarch64)
          curl -fSL -o "apps/landing/public/downloads/Bento_${VERSION}_aarch64.dmg" \
            "$CDN_BASE/dmg-aarch64" || echo "WARN: dmg-aarch64 not found"

          # Linux (AppImage x86_64)
          curl -fSL -o "apps/landing/public/downloads/Bento_${VERSION}_amd64.AppImage" \
            "$CDN_BASE/appimage-x86_64" || echo "WARN: appimage-x86_64 not found"

          # Linux (deb x86_64) — saved under the versioned name
          curl -fSL -o "apps/landing/public/downloads/Bento_${VERSION}_amd64.deb" \
            "$CDN_BASE/deb-x86_64" || echo "WARN: deb-x86_64 not found"

          echo "Downloaded assets:"
          ls -la apps/landing/public/downloads/

      - name: Install landing page dependencies
        run: bun install

      - name: Build landing page
        run: bun --cwd apps/landing run build

      - name: Deploy landing page to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel deploy apps/landing \
            --prod \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID" \
            --project="$VERCEL_PROJECT_ID"
          echo "Landing page deployed."
