# Bento Desktop ΓÇö CrabNebula Cloud Release Pipeline
#
# Triggered by:
#   - Pushing a tag matching v* (e.g., v0.2.0)
#   - Manual workflow_dispatch with a tag input (for re-runs)
#
# Pipeline:
#   1. prepare   ΓÇö Extracts version from tag
#   2. draft     ΓÇö Creates a release draft on CrabNebula Cloud
#   3. build     ΓÇö Matrix build across macOS (universal), Windows (x64), Linux (x64)
#   4. publish   ΓÇö Publishes the release on CrabNebula Cloud
#   5. deploy-landing ΓÇö Downloads assets from CrabNebula CDN ΓåÆ copies to landing page ΓåÆ deploys Vercel

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v0.2.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: apps/genesis-desktop
  CN_APPLICATION: bento-industries/bento

jobs:
  # ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
  # 1. PREPARE ΓÇö Extract version info
  # ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      tag_name: ${{ steps.get-version.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get-version
        shell: bash
        run: |
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
  # 2. DRAFT ΓÇö Create a release draft on CrabNebula Cloud
  # ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
  draft:
    needs: prepare
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Create draft release on CrabNebula Cloud
        uses: crabnebula-dev/cloud-release@1a8803698ba41de6b23e42abc5dcc3721308233c # v0
        with:
          command: release draft ${{ env.CN_APPLICATION }} --framework tauri
          api-key: ${{ secrets.CN_API_KEY }}

  # ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
  # 3. BUILD ΓÇö Matrix build across platforms
  # ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
  build:
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            bundles: dmg
            arch: universal
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            arch: x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            arch: amd64

    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # ΓöÇΓöÇ Sccache (distributed compilation cache) ΓöÇΓöÇ
      - name: Sccache cache
        uses: mozilla-actions/sccache-action@054db53350805f83040bf3e6e9b8cf5a139aa7c9 # v0.0.7

      # ΓöÇΓöÇ Rust toolchain ΓöÇΓöÇ
      # For universal-apple-darwin (macOS), we add both arch-specific targets
      # so cargo can build each architecture. For other platforms, the single
      # target triplet is sufficient.
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install stable --component rustfmt
          rustup default stable
          if [ "${{ matrix.target }}" = "universal-apple-darwin" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          else
            rustup target add ${{ matrix.target }}
          fi

      # ΓöÇΓöÇ Bun + Node.js ΓöÇΓöÇ
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "lts/*"

      # ΓöÇΓöÇ Linux system deps (Tauri v2) ΓöÇΓöÇ
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libgbm-dev \
            libsqlcipher-dev \
            pkg-config

      # ΓöÇΓöÇ Cargo registry cache ΓöÇΓöÇ
      - name: Cache Cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-release-${{ hashFiles(format('{0}/src-tauri/Cargo.lock', env.APP_DIR)) }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-release-

      # ΓöÇΓöÇ vcpkg (Windows: SQLCipher via vcpkg, same strategy as local dev) ΓöÇΓöÇ
      - name: Cache vcpkg
        if: runner.os == 'Windows'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/AppData/Local/Genesis/vcpkg
            ~/AppData/Local/Genesis/vcpkg-bincache
          key: vcpkg-${{ runner.os }}-${{ hashFiles(format('{0}/scripts/setup-vcpkg.ps1', env.APP_DIR)) }}

      - name: Install vcpkg + SQLCipher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${{ github.workspace }}\${{ env.APP_DIR }}\scripts\setup-vcpkg.ps1"
          # Persist env vars to GITHUB_ENV so they're available to subsequent steps
          @('VCPKG_ROOT','VCPKG_DEFAULT_TRIPLET','VCPKG_TARGET_TRIPLET','VCPKGRS_TRIPLET','VCPKG_BINARY_SOURCES','VCPKGRS_DYNAMIC','SQLCIPHER_STATIC','SQLCIPHER_INCLUDE_DIR','SQLCIPHER_LIB_DIR') | ForEach-Object {
            "$_=$([System.Environment]::GetEnvironmentVariable($_))" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          $llp = [System.Environment]::GetEnvironmentVariable('LIBCLANG_PATH')
          if ($llp) { "LIBCLANG_PATH=$llp" | Out-File -FilePath $env:GITHUB_ENV -Append }

      # ΓöÇΓöÇ Configure macOS signing ΓöÇΓöÇ
      # If APPLE_SIGNING_IDENTITY secret is set, signing is enabled.
      # Otherwise, signing is skipped (produces unsigned .app/.dmg).
      # This allows adding Apple certificates later without workflow changes.
      - name: Configure macOS signing
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ -n "${{ secrets.APPLE_SIGNING_IDENTITY }}" ]; then
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}" >> "$GITHUB_ENV"
            echo "APPLE_PROVIDER_SHORT_NAME=${{ secrets.APPLE_PROVIDER_SHORT_NAME }}" >> "$GITHUB_ENV"
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi

      # ΓöÇΓöÇ Build the Tauri app ΓöÇΓöÇ
      # If updater signing secrets are available and valid, they are used.
      # If signing fails (e.g. incorrect key/password), the build retries
      # without updater artifacts so that unsigned bundles are still produced.
      - name: Build Tauri app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Tauri v2 uses TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          # Legacy name TAURI_KEY_PASSWORD is kept for fallback compatibility
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          LIBSQLITE3_FLAGS: -USQLITE_OMIT_LOAD_EXTENSION
        run: |
          # Linux-only diagnostic: verify signing env var integrity
          if [ "${{ runner.os }}" = "Linux" ]; then
            echo "=== Signing env var diagnostics ==="
            for var in TAURI_SIGNING_PRIVATE_KEY TAURI_KEY_PASSWORD TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
              val="${!var}"
              if [ -n "$val" ]; then
                echo "$var: EXISTS | length=${#val}"
              else
                echo "$var: NOT SET"
              fi
            done
            echo "=== Key fingerprint (sha256) ==="
            key_val="$TAURI_SIGNING_PRIVATE_KEY"
            if [ -n "$key_val" ]; then
              printf "%s" "$key_val" | sha256sum | cut -d" " -f1
            fi
            echo "=== Password length ==="
            pw_val="$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            if [ -n "$pw_val" ]; then
              echo "length=${#pw_val}"
            fi
            echo "If lengths differ from Windows: trailing newline, CRLF, or shell metacharacters."
          fi
          bun install
          bun run tauri build \
            --bundles ${{ matrix.bundles }} \
            --target ${{ matrix.target }} || {
            echo "Build with signing failed ΓÇö retrying without updater artifacts (expected when signing secrets are missing or mismatched)"
            bun run tauri build \
              --bundles ${{ matrix.bundles }} \
              --target ${{ matrix.target }} \
              --config '{"bundle":{"createUpdaterArtifacts":false}}'
          }

      # ΓöÇΓöÇ Verify updater artifacts exist ΓöÇΓöÇ
      - name: Verify updater artifacts
        shell: bash
        run: |
          SIG_COUNT=$(find src-tauri/target -name "*.sig" 2>/dev/null | wc -l)
          ZIP_COUNT=$(find src-tauri/target \( -name "*.tar.gz" -o -name "*.nsis.zip" \) 2>/dev/null | wc -l)
          echo "::notice::Found $SIG_COUNT signature(s) and $ZIP_COUNT archive(s) for ${{ matrix.target }}"
          if [ "$SIG_COUNT" -eq 0 ]; then
            echo "::warning title=No updater artifacts::No .sig files found for ${{ matrix.target }}. This platform will NOT receive updates. Ensure TAURI_SIGNING_PRIVATE_KEY is configured correctly in repository secrets."
          fi

      # ΓöÇΓöÇ Copy bundles to standard target paths for CrabNebula discovery ΓöÇΓöÇ
      # cn release upload --framework tauri searches for bundles at
      # src-tauri/target/release/bundle/ from its working directory.
      # The matrix target (e.g. universal-apple-darwin) produces bundles in a
      # target-specific subdirectory, so we copy them to the standard location
      # that cn expects. We copy to both APP_DIR (if cn respects working-directory)
      # and repo root (if cn runs from workspace root as some @v0 actions do).
      - name: Copy bundles to standard target path for cn
        shell: bash
        run: |
          SRC="src-tauri/target/${{ matrix.target }}/release/bundle"
          APP_STANDARD="src-tauri/target/release/bundle"
          ROOT_STANDARD="${{ github.workspace }}/src-tauri/target/release/bundle"

          echo "=== Bundle discovery debug ==="
          echo "pwd: $(pwd)"
          echo "Source: $SRC"
          echo "APP_DIR standard: $APP_STANDARD"
          echo "Repo root standard: $ROOT_STANDARD"

          if [ ! -d "$SRC" ]; then
            echo "ERROR: Source bundle directory not found at $SRC"
            ls -la src-tauri/target/ 2>/dev/null | head -20 || true
            exit 1
          fi

          echo "Source bundles:"
          ls -laR "$SRC/" | head -40 || true

          mkdir -p "$APP_STANDARD"
          cp -R "$SRC/"* "$APP_STANDARD/" 2>/dev/null || true
          echo "Copied to APP_DIR standard: $APP_STANDARD"
          ls -la "$APP_STANDARD/" 2>/dev/null || echo "  (empty)"

          mkdir -p "$ROOT_STANDARD"
          cp -R "$SRC/"* "$ROOT_STANDARD/" 2>/dev/null || true
          echo "Copied to repo root standard: $ROOT_STANDARD"
          ls -la "$ROOT_STANDARD/" 2>/dev/null || echo "  (empty)"

          echo "All bundles from repo root:"
          find "${{ github.workspace }}" -maxdepth 10 \( \
            -name "*.dmg" -o -name "*.app" -o -name "*.zip" -o -name "*.deb" -o \
            -name "*.AppImage" -o -name "*.exe" -o -name "*.msi" -o -name "*.sig" -o \
            -name "*.tar.gz" \
          \) 2>/dev/null | head -20 || true

      # ΓöÇΓöÇ Verify bundles before upload ΓöÇΓöÇ
      - name: Verify bundles before CrabNebula upload
        shell: bash
        run: |
          echo "=== Pre-upload verification ==="
          echo "pwd: $(pwd)"
          echo "--- APP_DIR standard path ---"
          ls -la "src-tauri/target/release/bundle/" 2>/dev/null || echo "  (not found)"
          echo "--- Repo root standard path ---"
          ls -la "${{ github.workspace }}/src-tauri/target/release/bundle/" 2>/dev/null || echo "  (not found)"
          echo "--- Discovered assets ---"
          find . -maxdepth 8 \( \
            -name "*.dmg" -o -name "*.app" -o -name "*.zip" -o -name "*.deb" -o \
            -name "*.AppImage" -o -name "*.exe" -o -name "*.msi" -o -name "*.sig" -o \
            -name "*.tar.gz" \
          \) 2>/dev/null | head -20 || true

      # ΓöÇΓöÇ Upload assets to CrabNebula Cloud ΓöÇΓöÇ
      - name: Upload assets to CrabNebula Cloud
        uses: crabnebula-dev/cloud-release@1a8803698ba41de6b23e42abc5dcc3721308233c # v0
        with:
          command: release upload ${{ env.CN_APPLICATION }} --framework tauri
          api-key: ${{ secrets.CN_API_KEY }}
          working-directory: ${{ env.APP_DIR }}

  # ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
  # 4. PUBLISH ΓÇö Publish the release on CrabNebula Cloud
  # ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Publish release on CrabNebula Cloud
        uses: crabnebula-dev/cloud-release@1a8803698ba41de6b23e42abc5dcc3721308233c # v0
        with:
          command: release publish ${{ env.CN_APPLICATION }} --framework tauri
          api-key: ${{ secrets.CN_API_KEY }}

  # ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
  # 5. DEPLOY LANDING ΓÇö Download assets from CrabNebula CDN,
  #    sync to landing page public/downloads/, deploy Vercel
  # ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
  deploy-landing:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Download release assets from CrabNebula CDN
        working-directory: apps/landing
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p public/downloads

          CDN_BASE="https://cdn.crabnebula.app/download/bento-industries/bento/latest/platform"

          # Windows (NSIS x86_64)
          curl -fSL -o "public/downloads/Bento_${VERSION}_x64-setup.exe" \
            "$CDN_BASE/nsis-x86_64" || echo "WARN: nsis-x86_64 not found"

          # macOS (DMG universal)
          curl -fSL -o "public/downloads/Bento_${VERSION}_universal.dmg" \
            "$CDN_BASE/dmg-universal" || echo "WARN: dmg-universal not found"

          # Linux (AppImage x86_64)
          curl -fSL -o "public/downloads/Bento_${VERSION}_amd64.AppImage" \
            "$CDN_BASE/appimage-x86_64" || echo "WARN: appimage-x86_64 not found"

          # Linux (deb x86_64) ΓÇö saved under the versioned name
          curl -fSL -o "public/downloads/Bento_${VERSION}_amd64.deb" \
            "$CDN_BASE/deb-x86_64" || echo "WARN: deb-x86_64 not found"

          echo "Downloaded assets:"
          ls -la public/downloads/

      - name: Debug ΓÇö verify paths before Vercel build
        working-directory: apps/landing
        run: |
          echo "=== Path diagnostics ==="
          echo "pwd: $(pwd)"
          echo "workspace: ${{ github.workspace }}"
          echo "repo relative: ${PWD#${{ github.workspace }}/}"
          echo "--- package.json ---"
          ls -la package.json 2>/dev/null || echo "MISSING: no package.json at $(pwd)"
          echo "--- .vercel/project.json ---"
          cat .vercel/project.json 2>/dev/null || echo "MISSING: no .vercel/project.json"
          echo "--- vercel.json ---"
          cat vercel.json 2>/dev/null || echo "MISSING: no vercel.json"
          echo "--- Vercel project env vars ---"
          echo "VERCEL_ORG_ID: ${VERCEL_ORG_ID:+SET}"
          echo "VERCEL_PROJECT_ID: ${VERCEL_PROJECT_ID:+SET}"

      - name: Build landing page with Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          bun x vercel pull --yes --environment=production
          bun x vercel build --prod --yes

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          bun x vercel deploy --prebuilt --prod --yes
          echo "Landing page deployed to production."
