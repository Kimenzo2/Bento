# Bento Desktop — Release Pipeline
#
# Triggered by:
#   - Pushing a tag matching v* (e.g., v0.2.0)
#   - Manual workflow_dispatch with a tag input (for re-runs)
#
# Pipeline:
#   1. prepare   — Creates a draft GitHub Release with generated notes
#   2. build     — Matrix build across macOS (aarch64), Windows (x64), Linux (x64)
#                 Builds, signs, and uploads platform artifacts + updater artifacts
#   3. publish   — Marks the draft release as "Published" once all matrix jobs pass

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.2.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: apps/genesis-desktop

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────
  # 1. PREPARE — Create a draft release
  # ─────────────────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      tag_name: ${{ steps.get-version.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get-version
        shell: bash
        run: |
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get-version.outputs.tag_name }}
          name: Bento v${{ steps.get-version.outputs.version }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: false

  # ─────────────────────────────────────────────────────────
  # 2. BUILD — Matrix build across platforms
  # ─────────────────────────────────────────────────────────
  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            arch: arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            arch: x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            arch: amd64

    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Sccache (distributed compilation cache) ──
      - name: Sccache cache
        uses: mozilla-actions/sccache-action@v0.0.7
        with:
          cache-key: ${{ runner.os }}-release-${{ hashFiles(format('{0}/src-tauri/Cargo.lock', env.APP_DIR)) }}

      # ── Rust toolchain ──
      - name: Install Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install stable --component rustfmt
          rustup default stable
          rustup target add ${{ matrix.target }}

      # ── Linux system deps (Tauri) ──
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev

      # ── Cargo registry cache ──
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-release-${{ hashFiles(format('{0}/src-tauri/Cargo.lock', env.APP_DIR)) }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-release-

      # ── Pre-build MCP sidecar ──
      - name: Build MCP sidecar
        shell: bash
        env:
          RUSTC_WRAPPER: sccache
        run: |
          # Target dir is auto-detected as src-tauri/target/ since the Cargo.toml
          # is at src-tauri/Cargo.toml (no workspace Cargo.toml at project root)
          cargo build --profile ci \
            --target ${{ matrix.target }} \
            --manifest-path src-tauri/Cargo.toml \
            --bin bento-mcp
          # Copy sidecar into the location Tauri expects during bundling
          mkdir -p src-tauri/binaries
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "src-tauri/target/${{ matrix.target }}/ci/bento-mcp.exe" \
               "src-tauri/binaries/bento-mcp-${{ matrix.target }}.exe"
          else
            cp "src-tauri/target/${{ matrix.target }}/ci/bento-mcp" \
               "src-tauri/binaries/bento-mcp-${{ matrix.target }}"
          fi

      # ── Build + bundle the Tauri app (unsigned) ──
      - name: Build Tauri app
        id: build-tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater — self-generated keypair stored in GitHub Secrets
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: ${{ env.APP_DIR }}
          tauriScript: bun run tauri
          tagName: ${{ needs.prepare.outputs.tag_name }}
          releaseName: Bento v${{ needs.prepare.outputs.version }}
          releaseDraft: true
          releaseId: ''
          bundles: ${{ matrix.bundles }}
          target: ${{ matrix.target }}
          architecture: ${{ matrix.arch }}
          includeUpdaterArtifacts: true
          createUpdaterArtifacts: true

      # ── Upload platform artifacts ──
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bento-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            ${{ env.APP_DIR }}/src-tauri/target/release/bundle/**/*
            ${{ env.APP_DIR }}/src-tauri/target/*.msi*
            ${{ env.APP_DIR }}/src-tauri/target/release/updater/**/*

  # ─────────────────────────────────────────────────────────
  # 3. PUBLISH — Mark the draft release as published
  # ─────────────────────────────────────────────────────────  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          name: Bento v${{ needs.prepare.outputs.version }}
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-landing:
    needs: [prepare, build, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p apps/landing/public/downloads
          gh release download "${{ needs.prepare.outputs.tag_name }}" \
            --repo "${{ github.repository }}" \
            --dir apps/landing/public/downloads \
            --pattern "Bento_*"
          echo "Downloaded assets:"
          ls -la apps/landing/public/downloads/

      - name: Install dependencies
        run: bun install
      - name: Build landing page
        run: bun --cwd apps/landing run build

      - name: Deploy landing page to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel deploy apps/landing \
            --prod \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID" \
            --project="$VERCEL_PROJECT_ID"
          echo "Landing page deployed. Configure the custom domain in Vercel dashboard."
