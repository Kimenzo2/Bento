name: CI

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: ['**']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Svelte Check
        run: bun run check
        # svelte-check catches Svelte 5 compilation errors
        # (e.g. component_invalid_directive, missing imports,
        #  type errors in .svelte files)

      - name: Lint
        run: bun run lint

      - name: Type Check (fast)
        continue-on-error: true
        run: bun run type-check:fast

      - name: Unit Tests
        run: bun run test
