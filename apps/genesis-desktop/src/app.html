<!doctype html>
<html lang="en" spellcheck="false">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.lr-ingest.com https://cdn.lr-in.com https://cdn.logr-in.com https://cdn.logrocket.io module: http://module.localhost; style-src 'self' 'unsafe-inline' module: http://module.localhost; img-src 'self' blob: data: https: asset: http://asset.localhost; font-src 'self' data: module: http://module.localhost; media-src 'self' blob: data: module: http://module.localhost; connect-src 'self' http://ipc.localhost ipc: http://localhost:* https://*.supabase.co https://ipc:* wss://* https://cdn.crabnebula.app https://iamazeyou.me https://api.iamazeyou.me https://r.logrocket.com https://*.lr-in.com https://*.logr-in.com https://*.lr-ingest.com https://*.ingest-lr.com module: http://module.localhost; frame-src 'self'; worker-src 'self' blob:"
    />
    <title>Bento</title>
    <script>
      (function () {
        const fallback = { themeId: "default", mode: "light", tokens: {} };
        let snapshot = fallback;

        try {
          const raw = sessionStorage.getItem("__bento_theme_snapshot");
          if (raw) {
            const parsed = JSON.parse(raw);
            if (
              parsed &&
              typeof parsed.themeId === "string" &&
              (parsed.mode === "light" || parsed.mode === "dark")
            ) {
              snapshot = {
                themeId: parsed.themeId,
                mode: parsed.mode,
                tokens: parsed.tokens && typeof parsed.tokens === "object" ? parsed.tokens : {},
              };
            }
          }
        } catch {
          snapshot = fallback;
        }

        const root = document.documentElement;
        root.dataset.theme = snapshot.themeId;
        root.classList.toggle("dark", snapshot.mode === "dark");
        root.style.colorScheme = snapshot.mode;

        Object.entries(snapshot.tokens).forEach(([key, value]) => {
          if (typeof value === "string") {
            root.style.setProperty(key, value);
          }
        });
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
